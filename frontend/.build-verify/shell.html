<pre id="__m" style="display:none"></pre>
<script>
window.addEventListener('load', function () {
  var ids = ['root', 'chatroot', 'sidebar', 'chatcol', 'scroll', 'wrap', 'hero', 'inputarea', 'inputcard'];
  var out = ['viewport=' + window.innerWidth + 'x' + window.innerHeight,
             'scrollW=' + document.documentElement.scrollWidth + ' clientW=' + document.documentElement.clientWidth,
             'scrollH=' + document.documentElement.scrollHeight + ' clientH=' + document.documentElement.clientHeight];
  ids.forEach(function (id) {
    var e = document.getElementById(id);
    if (!e) { out.push(id + '=MISSING'); return; }
    var r = e.getBoundingClientRect();
    if(id==='wrap'||id==='hero'){var cs=getComputedStyle(e);out.push(id+' CSS box='+cs.boxSizing+' pl='+cs.paddingLeft+' pr='+cs.paddingRight+' w='+cs.width);} out.push(id + '=[l:' + r.left.toFixed(1) + ' t:' + r.top.toFixed(1) + ' w:' + r.width.toFixed(1) + ' h:' + r.height.toFixed(1) + ']');
  });
  document.getElementById('__m').textContent = '@@@' + out.join('|') + '@@@';
});
</script>
