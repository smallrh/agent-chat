services:

  # -------------------- PostgreSQL --------------------
  postgres:
    image: postgres:16
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_customer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_customer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  # -------------------- Redis --------------------
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  # -------------------- Kafka --------------------
  kafka:
    image: apache/kafka:4.0.0
    container_name: agent-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # 单节点
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # 数据目录
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_data:/var/lib/kafka/data

    # Kafka 没有官方 healthcheck 命令，用自带的工具探测 broker 可用性。
    # 注意：KRaft 单节点下 topic 自动创建被关掉了（KAFKA_AUTO_CREATE_TOPICS_ENABLE=false），
    # 所以 app 启动前要确保 topic 已建好，否则 producer 会一直等 metadata。
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - agent-net

  # -------------------- Qdrant --------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  # -------------------- MinIO --------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agent-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net


# -------------------- 持久化卷 --------------------
volumes:
  postgres_data:
  redis_data:
  kafka_data:
  qdrant_data:
  minio_data:


# -------------------- 网络 --------------------
networks:
  agent-net:
    driver: bridge