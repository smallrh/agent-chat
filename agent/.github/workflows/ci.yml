name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff mypy

      - name: 生成 .env（CI 里用占位值，不接触真实密钥）
        run: cp .env.example .env

      - name: ruff
        run: ruff check .

      - name: mypy
        # 首次接入类型检查大概率有大量告警，先作为参考指标不计入失败。
        # 建议按模块逐步收敛，收敛完把 continue-on-error 去掉。
        continue-on-error: true
        run: mypy

      - name: pytest
        # 根目录 _test_*.py 由 tests/test_legacy_scripts.py 收编（均为离线脚本）
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像（验证 Dockerfile 可跑通）
        run: docker build -t agent-system:ci .
